name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: toolchains
        run: python3 -c 'import json, os; versions=json.load(open("toolchains.json")); output=open(os.environ["GITHUB_OUTPUT"], "a"); output.write("\n".join(k+"="+v for k,v in versions.items())+"\n")'
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: ${{ steps.toolchains.outputs.deno }}
          cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ steps.toolchains.outputs.node }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ steps.toolchains.outputs.bun }}
      - run: deno task check:toolchains
      - run: deno task verify
      - run: deno task check:budgets
      - run: deno task publish:dry-run
